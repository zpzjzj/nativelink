name: CI / OSS validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Toolchain
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: Generate config reference
        run: node web/apps/docs/scripts/gen-config-reference.mjs main
      - name: Config tests
        run: cargo test --locked -p nativelink-config --test deserialization_test
      - name: Build store
        run: cargo build --locked -p nativelink-store
      - name: OSS and existing S3 adapter tests
        run: cargo test --locked -p nativelink-store --test oss_store_test --test common_s3_utils_test --test oci_store_test --test r2_store_test --test s3_store_test
      - name: Clippy
        run: cargo clippy --locked -p nativelink-store --lib --test oss_store_test --test common_s3_utils_test -- -D warnings
      - name: Upload generated reference
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: oss-config-reference
          path: web/apps/docs/content/docs/reference/nativelink-config/main.mdx
